# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = uk.co.androidalliance.plugin
pluginName = D-Pad-UI-Addon
pluginRepositoryUrl = https://github.com/nodinosaur/dpad-ui-addon

# SemVer format -> https://semver.org
pluginVersion = 2.0.0

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# Minimum Intellij Platform version supported by this plugin.
# There is deliberately no `untilBuild`: the range is left open-ended in build.gradle.kts so
# the plugin keeps working on future Android Studio / IntelliJ IDEA releases. `plugin.xml`
# carries no <idea-version> either ? this property is the single source of truth.
pluginSinceBuild = 243

# Android Studio Version -> https://plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html
ideVersion = 2025.1.1.10
#ideVersion = 2024.3.2.14
#localIdeOverride
#-Didea.kotlin.plugin.use.k2=true

# Path to a local IDE installation. Enables the `runLocalIde` task and adds the install as an
# extra `verifyPlugin` target. Ignored when unset or when the path does not exist, so this can
# safely be overridden per-machine in ~/.gradle/gradle.properties.
localIdePath = /Applications/Android Studio.app

# grpc-java ships an x86_64 binary under its `osx-aarch_64` classifier, which cannot run on
# Apple Silicon without Rosetta. Point at a native build instead (brew install
# protoc-gen-grpc-java). Leave empty to use the Maven artifact.
protocGenGrpcJavaPath = /opt/homebrew/bin/protoc-gen-grpc-java

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
platformType = IC
platformVersion = 2024.2.5

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
# platformPlugins =
# Example: platformBundledPlugins = com.intellij.java
# platformBundledPlugins =

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 8.13


# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.parallel = true
org.gradle.jvmargs = -Xmx4096m
kotlin.code.style = official